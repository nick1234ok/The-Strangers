<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Strangers</title>

  <!-- Space Mono from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">

  <style>
    /* ── LOCAL FONT ── */
    @font-face {
      font-family: 'ZTFormom';
      src: url('fonts/ZT Formom.ttf') format('truetype');
      font-weight: normal;
    }

    /* ── RESET ── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0a;
      font-family: 'Space Mono', monospace;
    }

    /* ────────────────────────────────────────
       BACKGROUND LAYERS
       Two absolutely stacked images.
       Artboard 2 starts visible (opacity 1).
       Artboard 3 starts invisible (opacity 0).
       On first mousemove: swap opacities.
    ──────────────────────────────────────── */
    #bg-base,
    #bg-hover {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: opacity 0.8s ease;
    }

    /* STATE 1 — default image */
    #bg-base {
      background-image: url('images/Artboard 2@4x.png');
      opacity: 1;
      z-index: 0;
    }

    /* STATE 2 — hover image (sits on top, hidden until triggered) */
    #bg-hover {
      background-image: url('images/Artboard 3@4x.png');
      opacity: 0;
      z-index: 1;
    }

    /* ────────────────────────────────────────
       TOP NAVIGATION
       Revealed on first mousemove.
    ──────────────────────────────────────── */
    #top-nav {
      display: none;
    }

    /* ────────────────────────────────────────
       ARROW BUTTON — bottom right
    ──────────────────────────────────────── */
    #arrow-btn {
      position: fixed;
      bottom: 32px;
      right: 32px;
      z-index: 30;

      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: #c8a84b;
      border: none;
      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      opacity: 0;
      transition: opacity 0.6s ease, transform 0.2s ease;
      pointer-events: none;
    }

    #arrow-btn.show {
      opacity: 1;
      pointer-events: all;
    }

    #arrow-btn:hover {
      transform: scale(1.08);
    }

    /* The → arrow inside the button */
    #arrow-btn span {
      font-size: 24px;
      font-weight: 700;
      color: #0a0a0a;
      line-height: 1;
      /* nudge arrow slightly right for optical centering */
      transform: translateX(2px);
      display: block;
    }

    /* ────────────────────────────────────────
       MUTE BUTTON — bottom left
       Hidden until audio starts.
    ──────────────────────────────────────── */
    #mute-btn {
      position: fixed;
      bottom: 32px;
      left: 32px;
      z-index: 10;

      background: none;
      border: none;
      cursor: pointer;

      font-family: 'Space Mono', monospace;
      font-size: 12px;
      color: #c8a84b;
      letter-spacing: 0.08em;

      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }

    #mute-btn.show {
      opacity: 1;
      pointer-events: all;
    }

    #mute-btn:hover {
      opacity: 0.7;
    }

    /* ────────────────────────────────────────
       HOME BUTTON — top left
       Hidden on homepage, shown once concept section begins.
    ──────────────────────────────────────── */
    #home-btn {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 50;

      width: 40px;
      height: 40px;
      border-radius: 4px;
      background: #0a0a0a;
      border: none;
      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    #home-btn.show {
      opacity: 1;
      pointer-events: all;
    }

    #home-btn:hover {
      opacity: 0.7;
    }

    /* ────────────────────────────────────────
       SECTION 3 — CHARACTER SELECTION
    ──────────────────────────────────────── */
    #pick-section {
      position: fixed;
      inset: 0;
      background: #f5c800;
      z-index: 25;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      overflow: hidden;
    }

    #pick-section.visible {
      opacity: 1;
      pointer-events: all;
    }

    /* Outer rectangle border inset 40px */
    #pick-border {
      position: absolute;
      inset: 40px;
      border: 1px solid #0a0a0a;
      pointer-events: none;
    }

    /* Inner oval filling most of the rectangle */
    #pick-oval {
      position: absolute;
      left: 80px; right: 80px;
      top: 60px; bottom: 60px;
      border: 1px solid #0a0a0a;
      border-radius: 50%;
      pointer-events: none;
    }

    /* Starbursts at oval cardinal points */
    .pick-star {
      position: absolute;
      width: 50px;
      height: 50px;
      pointer-events: none;
    }
    .pick-star.top    { left: 50%; top: 60px;    transform: translate(-50%, -50%); }
    .pick-star.bottom { left: 50%; bottom: 60px; transform: translate(-50%, 50%); }
    .pick-star.left   { left: 80px; top: 50%;   transform: translate(-50%, -50%); }
    .pick-star.right  { right: 80px; top: 50%;  transform: translate(50%, -50%); }

    /* Selection counter — top right inside border */
    #pick-counter {
      position: absolute;
      top: 56px;
      right: 56px;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      color: #0a0a0a;
      z-index: 5;
    }

    /* Content: prompt + grid, centered inside oval */
    #pick-content {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    #pick-prompt {
      font-family: 'ZTFormom', serif;
      font-size: 28px;
      color: #0a0a0a;
      text-align: center;
      line-height: 1.3;
      white-space: nowrap;
    }
    #pick-prompt .red { color: #c0392b; }

    /* 3-column card grid */
    #pick-grid {
      display: grid;
      grid-template-columns: repeat(3, 160px);
      gap: 18px;
      justify-content: center;
    }

    /* ── Card base ── */
    .char-card {
      width: 160px;
      height: 110px;
      background: #0a0a0a;
      border-radius: 3px;
      box-shadow: 3px 5px 14px rgba(0,0,0,0.22);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      border: 3px solid transparent;
      transition: transform 0.3s ease, border-color 0.25s ease, box-shadow 0.3s ease;
      transform: rotate(var(--rot, 0deg));
    }

    /* Hover: straighten, lift */
    .char-card:not(.you-card):hover {
      transform: rotate(0deg) !important;
      box-shadow: 4px 8px 20px rgba(0,0,0,0.35);
    }

    /* Selected: red border, back to tilt */
    .char-card.selected {
      border-color: #c0392b;
    }
    .char-card.selected:not(:hover) {
      transform: rotate(var(--rot, 0deg));
    }

    /* YOU card: not hoverable */
    .char-card.you-card { cursor: default; }

    /* ── Default face ── */
    .card-default {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 10px 12px;
      transition: opacity 0.25s ease;
    }

    .card-q {
      position: absolute;
      top: 8px; left: 10px;
      font-family: 'ZTFormom', serif;
      font-size: 14px;
      color: #c8a84b;
      line-height: 1;
    }

    .card-name {
      font-family: 'ZTFormom', serif;
      font-size: 22px;
      color: #c8a84b;
      text-align: center;
      line-height: 1;
    }

    .card-label {
      font-family: 'Space Mono', monospace;
      font-size: 8px;
      color: rgba(255,255,255,0.5);
      text-align: center;
      line-height: 1.4;
    }

    /* ── Hover face ── */
    .card-hover {
      position: absolute;
      inset: 0;
      padding: 10px 11px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      opacity: 0;
      transition: opacity 0.25s ease;
      overflow: hidden;
    }

    .char-card:not(.you-card):hover .card-default { opacity: 0; }
    .char-card:not(.you-card):hover .card-hover   { opacity: 1; }

    .card-hover-name {
      font-family: 'ZTFormom', serif;
      font-size: 13px;
      color: #c8a84b;
      flex-shrink: 0;
    }

    .card-dialogue {
      font-family: 'Space Mono', monospace;
      font-size: 8px;
      color: rgba(255,255,255,0.8);
      line-height: 1.55;
      overflow: hidden;
    }

    /* ── Selected checkmark ── */
    .card-check {
      position: absolute;
      top: 6px; right: 8px;
      font-size: 12px;
      color: #c0392b;
      font-weight: 700;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .char-card.selected .card-check { opacity: 1; }

    /* Warning text above arrow */
    #pick-warning {
      position: fixed;
      bottom: 114px;
      right: 32px;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: #0a0a0a;
      text-align: right;
      line-height: 1.7;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      z-index: 30;
    }
    #pick-warning.show { opacity: 1; }

    /* ────────────────────────────────────────
       SECTION 3b — CHARACTER INTROS
    ──────────────────────────────────────── */
    #intro-section {
      position: fixed;
      inset: 0;
      background: #f5c800;
      z-index: 22;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      overflow: hidden;
    }
    #intro-section.visible { opacity: 1; pointer-events: all; }

    #intro-border {
      position: absolute;
      inset: 40px;
      border: 1px solid #0a0a0a;
      pointer-events: none;
    }
    #intro-oval {
      position: absolute;
      left: 80px; right: 80px;
      top: 60px; bottom: 60px;
      border: 1px solid #0a0a0a;
      border-radius: 50%;
      pointer-events: none;
    }
    .intro-star {
      position: absolute;
      width: 50px; height: 50px;
      pointer-events: none;
    }
    .intro-star.top    { left: 50%; top: 60px;    transform: translate(-50%, -50%); }
    .intro-star.bottom { left: 50%; bottom: 60px; transform: translate(-50%, 50%); }
    .intro-star.left   { left: 80px; top: 50%;   transform: translate(-50%, -50%); }
    .intro-star.right  { right: 80px; top: 50%;  transform: translate(50%, -50%); }

    /* Counter top right inside border */
    #intro-counter {
      position: absolute;
      top: 56px; right: 56px;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      color: #0a0a0a;
      z-index: 5;
    }

    /* Two-column content, centered inside oval */
    #intro-content {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 64px;
      width: min(820px, 68vw);
      transition: opacity 0.4s ease;
    }

    /* Left: shape */
    .intro-left {
      flex: 0 0 180px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .intro-shape {
      animation: shapeFloat 3s ease-in-out infinite;
      display: block;
    }
    @keyframes shapeFloat {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }

    /* Right: text stack */
    .intro-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .intro-name {
      font-family: 'ZTFormom', serif;
      font-size: 52px;
      color: #0a0a0a;
      line-height: 1;
    }
    .intro-role {
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      color: #0a0a0a;
      letter-spacing: 0.06em;
    }
    .intro-divider {
      width: 100%;
      height: 1px;
      background: #0a0a0a;
      opacity: 0.35;
    }
    .intro-dialogue {
      font-family: 'ZTFormom', serif;
      font-style: italic;
      font-size: 22px;
      color: #0a0a0a;
      max-width: 380px;
      line-height: 1.6;
    }

    /* ────────────────────────────────────────
       SECTION 4 — SIMULATION
    ──────────────────────────────────────── */
    #sim-section {
      position: fixed;
      inset: 0;
      background: #f5c800;
      z-index: 28;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      overflow: hidden;
    }
    #sim-section.visible { opacity: 1; pointer-events: all; }

    #sim-border {
      position: absolute;
      inset: 40px;
      border: 1px solid #0a0a0a;
      pointer-events: none;
    }
    #sim-oval {
      position: absolute;
      left: 80px; right: 80px;
      top: 60px; bottom: 60px;
      border: 1px solid #0a0a0a;
      border-radius: 50%;
      pointer-events: none;
    }
    .sim-star {
      position: absolute;
      width: 50px; height: 50px;
      pointer-events: none;
    }
    .sim-star.top    { left: 50%; top: 60px;    transform: translate(-50%, -50%); }
    .sim-star.bottom { left: 50%; bottom: 60px; transform: translate(-50%, 50%); }
    .sim-star.left   { left: 80px; top: 50%;   transform: translate(-50%, -50%); }
    .sim-star.right  { right: 80px; top: 50%;  transform: translate(50%, -50%); }

    /* Centered content column */
    #sim-content {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    /* Player row */
    #sim-players {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .sim-player-card {
      width: 80px; height: 50px;
      background: #0a0a0a;
      border-radius: 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 4px;
    }
    .spc-name {
      font-family: 'ZTFormom', serif;
      font-size: 14px;
      color: #c8a84b;
      text-align: center;
      line-height: 1;
    }
    .spc-label {
      font-family: 'Space Mono', monospace;
      font-size: 7px;
      color: rgba(255,255,255,0.55);
      text-align: center;
      line-height: 1.3;
    }

    /* Day counter */
    #sim-day {
      font-family: 'ZTFormom', serif;
      font-size: 38px;
      color: #0a0a0a;
      text-align: center;
      line-height: 1;
    }

    /* Pond SVG wrapper */
    #sim-pond-wrap { line-height: 0; }
    #sim-pond-svg { display: block; }
    #sim-pond-circle { transition: fill 1.5s ease; }

    /* Phase announcement */
    #sim-phase {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.04em;
      color: #0a0a0a;
      text-align: center;
      min-height: 16px;
      transition: opacity 0.4s ease;
    }

    /* Fish count */
    #sim-fish-count {
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      color: #0a0a0a;
      text-align: center;
    }

    /* Scrolling log */
    #sim-log {
      width: 340px;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: #0a0a0a;
      line-height: 1.8;
      text-align: center;
      min-height: 88px;
    }
    .sim-log-line { transition: opacity 0.4s ease; }

    /* ────────────────────────────────────────
       ENDING OVERLAY
    ──────────────────────────────────────── */
    #sim-end {
      position: fixed;
      inset: 0;
      z-index: 35;
      background: #0a0a0a;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.7s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #sim-end.visible { opacity: 1; pointer-events: all; }

    #end-lines {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      max-width: 640px;
      padding: 0 40px;
      text-align: center;
    }
    .end-line { transition: opacity 0.9s ease; }
    .end-heading {
      font-family: 'ZTFormom', serif;
      font-size: 52px;
      line-height: 1.1;
    }
    .end-body {
      font-family: 'Space Mono', monospace;
      font-size: 15px;
      line-height: 1.7;
    }
    .end-final {
      font-family: 'ZTFormom', serif;
      font-style: italic;
      font-size: 20px;
      line-height: 1.75;
      max-width: 560px;
    }
    .end-refresh {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
    }

    /* ────────────────────────────────────────
       SECTION 2 — CONCEPT SLIDES
       Full viewport overlay, hidden until homepage arrow is clicked.
    ──────────────────────────────────────── */
    #concept-section {
      position: fixed;
      inset: 0;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    #concept-section.visible {
      opacity: 1;
      pointer-events: all;
    }

    /* ── Slide layers — stacked, crossfade between them ── */
    .concept-slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .concept-slide.active {
      opacity: 1;
    }

    /* ── Progress dots ── */
    #concept-dots {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      align-items: center;
      z-index: 30;
    }

    .concept-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 1.5px solid #0a0a0a;
      background: transparent;
      transition: background 0.3s ease;
    }

    .concept-dot.active {
      background: #0a0a0a;
    }

    /* ────────────────────────────────────────
       INTERROGATION SECTION (z-index 26 — between intros and pick)
    ──────────────────────────────────────── */
    #interrogate-section {
      position: fixed;
      inset: 0;
      background: #f5c800;
      z-index: 26;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      overflow: hidden;
    }
    #interrogate-section.visible { opacity: 1; pointer-events: all; }

    #interrogate-border {
      position: absolute;
      inset: 40px;
      border: 1px solid #0a0a0a;
      pointer-events: none;
    }
    #interrogate-oval {
      position: absolute;
      left: 80px; right: 80px;
      top: 60px; bottom: 60px;
      border: 1px solid #0a0a0a;
      border-radius: 50%;
      pointer-events: none;
    }
    .interrogate-star {
      position: absolute;
      width: 50px; height: 50px;
      pointer-events: none;
    }
    .interrogate-star.top    { left: 50%; top: 60px;    transform: translate(-50%, -50%); }
    .interrogate-star.bottom { left: 50%; bottom: 60px; transform: translate(-50%, 50%); }
    .interrogate-star.left   { left: 80px; top: 50%;   transform: translate(-50%, -50%); }
    .interrogate-star.right  { right: 80px; top: 50%;  transform: translate(50%, -50%); }

    #interrogate-stranger-counter {
      position: absolute;
      top: 56px; right: 56px;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      color: #0a0a0a;
      z-index: 5;
    }

    #interrogate-content {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 64px;
      width: min(820px, 68vw);
    }

    #interrogate-left {
      flex: 0 0 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    #interrogate-char-name {
      font-family: 'ZTFormom', serif;
      font-size: 48px;
      color: #0a0a0a;
      text-align: center;
      line-height: 1.1;
    }
    #interrogate-char-label {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      color: rgba(0,0,0,0.6);
      text-align: center;
      line-height: 1.4;
    }
    #interrogate-shape {
      animation: shapeFloat 3s ease-in-out infinite;
    }

    #interrogate-right {
      flex: 1;
      max-width: 480px;
      display: flex;
      flex-direction: column;
    }
    #interrogate-heading {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(0,0,0,0.5);
      margin-bottom: 16px;
    }
    #interrogate-questions {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .iq-btn {
      width: 100%;
      background: transparent;
      border: 1px solid rgba(0,0,0,0.25);
      border-radius: 2px;
      padding: 14px 18px;
      text-align: left;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      color: #0a0a0a;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, opacity 0.2s ease;
    }
    .iq-btn:hover:not(.used):not(.exhausted) { background: rgba(0,0,0,0.07); }
    .iq-btn.used {
      background: rgba(0,0,0,0.12);
      border-color: #0a0a0a;
      cursor: default;
    }
    .iq-btn.exhausted {
      opacity: 0.3;
      pointer-events: none;
    }
    #interrogate-answer-panel {
      min-height: 80px;
      border-left: 3px solid #0a0a0a;
      padding-left: 18px;
      margin-top: 20px;
      font-family: 'ZTFormom', serif;
      font-style: italic;
      font-size: 19px;
      color: #0a0a0a;
      line-height: 1.65;
      transition: opacity 0.5s ease;
    }
    #interrogate-remaining {

    function fadeAudioIn(audioEl, targetVol, ms) {
      const steps    = 40;
      const interval = ms / steps;
      const delta    = (targetVol - audioEl.volume) / steps;

    /* Fisher-Yates shuffle */
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    /* 9 strangers picked fresh each session */
    const SESSION_STRANGERS = shuffle(ALL_CHARACTERS).slice(0, 9);

    /* ────────────────────────────────────────
       CHARACTER SELECTION — STATE & RENDER
    ──────────────────────────────────────── */
    const pickSection = document.getElementById('pick-section');
    const pickGrid    = document.getElementById('pick-grid');
    const pickCounter = document.getElementById('pick-counter');
    const pickWarning = document.getElementById('pick-warning');
    let selectedIds   = [];

    function updateCounter() {
      pickCounter.textContent = `${selectedIds.length} / 3 selected`;
      if (selectedIds.length === 3) {
        arrowBtn.classList.add('show');
        pickWarning.classList.add('show');
      } else {
        arrowBtn.classList.remove('show');
        pickWarning.classList.remove('show');
      }
    }

    /* Build a stranger card element */
    function createCard(char) {
      const rot  = (Math.random() * 8 - 4).toFixed(2);
      const card = document.createElement('div');
      card.className = 'char-card';
      card.style.setProperty('--rot', rot + 'deg');
      card.dataset.id = char.id;

      card.innerHTML = `
        <div class="card-default">
          <span class="card-q">?</span>
          <span class="card-name">${char.name}</span>
          <span class="card-label">${char.label}</span>
        </div>
        <div class="card-hover">
          <span class="card-hover-name">${char.name}</span>
          <p class="card-dialogue">${char.dialogue}</p>
        </div>
        <span class="card-check">✓</span>
      `;

      card.addEventListener('click', () => {
        playClick();
        if (card.classList.contains('selected')) {
          card.classList.remove('selected');
          selectedIds = selectedIds.filter(x => x !== char.id);
        } else if (selectedIds.length < 3) {
          card.classList.add('selected');
          selectedIds.push(char.id);
        }
        updateCounter();
      });

      return card;
    }

    /* Build the YOU card (non-selectable) */
    function createYouCard() {
      const rot  = (Math.random() * 6 - 3).toFixed(2);
      const card = document.createElement('div');
      card.className = 'char-card you-card';
      card.style.setProperty('--rot', rot + 'deg');
      card.innerHTML = `
        <div class="card-default">
          <span class="card-name" style="font-size:30px">YOU</span>
        </div>
      `;
      return card;
    }

    function renderPickGrid() {
      pickGrid.innerHTML = '';
      pickGrid.appendChild(createYouCard());
      SESSION_STRANGERS.forEach(char => pickGrid.appendChild(createCard(char)));
    }

    /* Enter character selection section */
    function enterPickSection() {
      inPickMode  = true;
      selectedIds = [];

      // Hide concept section underneath
      conceptSection.classList.remove('visible');

      // Reset counter and arrow
      updateCounter();

      // Render fresh cards
      renderPickGrid();

      // Fade in pick section
      pickSection.classList.add('visible');
    }

    /* ────────────────────────────────────────
       CONCEPT SLIDES — state
    ──────────────────────────────────────── */
    const conceptSection = document.getElementById('concept-section');
    const conceptSlides  = document.querySelectorAll('.concept-slide');
    const conceptDots    = document.querySelectorAll('.concept-dot');
    const TOTAL_SLIDES   = 5;
    const AUTO_DELAY     = 3500; // ms before auto-advance

    let currentSlide  = 0;
    let autoTimer     = null;
    let inConceptMode = false;

    /* Go to a specific slide index */
    function goToSlide(index) {
      // Deactivate current
      conceptSlides[currentSlide].classList.remove('active');
      conceptDots[currentSlide].classList.remove('active');

      currentSlide = index;

      // Activate new
      conceptSlides[currentSlide].classList.add('active');
      conceptDots[currentSlide].classList.add('active');
    }

    /* Advance to next slide. On last slide, do nothing (wait for user). */
    function advanceSlide() {
      if (currentSlide < TOTAL_SLIDES - 1) {
        goToSlide(currentSlide + 1);
        // Schedule next auto-advance only if not on last slide after this
        if (currentSlide < TOTAL_SLIDES - 1) {
          autoTimer = setTimeout(advanceSlide, AUTO_DELAY);
        } 
      }
    }

    const homeBtn = document.getElementById('home-btn');

      conceptSection.classList.add('visible');

      // Start auto-advance timer
      autoTimer = setTimeout(advanceSlide, AUTO_DELAY);
    }

      introCounter.textContent = `${index + 1} / ${SESSION_STRANGERS.length}`;

        renderIntroCard(SESSION_STRANGERS[index], index);

    function enterIntroSection() {

    /* ════════════════════════════════════════════

    const interrogateSection  = document.getElementById('interrogate-section');
    const interrogateTooltip  = document.getElementById('interrogate-tooltip');

    function renderInterrogateStranger(index) {
      const stranger  = SESSION_STRANGERS[index];
      const asked     = interrogateState.questionsAsked[index];
      const usedCount = asked.length;
      const leftCount = 3 - usedCount;

      document.getElementById('interrogate-stranger-counter').textContent = `STRANGER ${index + 1} / 9`;
      document.getElementById('interrogate-char-name').textContent  = stranger.name;
      document.getElementById('interrogate-char-label').textContent = stranger.label;

      const answerPanel = document.getElementById('interrogate-answer-panel');
      const remainingEl = document.getElementById('interrogate-remaining');
      const questionsEl = document.getElementById('interrogate-questions');

      answerPanel.style.opacity = '0';
      answerPanel.textContent   = '';
      remainingEl.textContent   = `${leftCount} question${leftCount === 1 ? '' : 's'} remaining`;

      questionsEl.innerHTML = '';
      INTERROGATION_QUESTIONS.forEach((q, qi) => {
        const btn     = document.createElement('button');
        btn.className = 'iq-btn';
        const wasAsked = asked.includes(qi);

        if (wasAsked) {
          btn.classList.add('used');
          btn.textContent = '→ ' + q;
        } else if (usedCount >= 3) {
          btn.classList.add('exhausted');
          btn.textContent = q;
        } else {
          btn.textContent = q;
          btn.addEventListener('click', () => {
            playClick();
            interrogateState.questionsAsked[index].push(qi);
            interrogateState.answersGiven[index].push(qi);

            // Fade answer in
            answerPanel.style.opacity = '0';
            setTimeout(() => {
              answerPanel.textContent   = stranger.answers[qi];
              answerPanel.style.opacity = '1';
            }, 300);

            // Mark button used
            btn.classList.add('used');
            btn.textContent         = '→ ' + q;
            btn.style.pointerEvents = 'none';

            // Update remaining counter
            const newLeft = 3 - interrogateState.questionsAsked[index].length;
            remainingEl.textContent = `${newLeft} question${newLeft === 1 ? '' : 's'} remaining`;

            // Exhaust unasked buttons if limit reached
            if (interrogateState.questionsAsked[index].length >= 3) {
              questionsEl.querySelectorAll('.iq-btn:not(.used)').forEach(b => b.classList.add('exhausted'));
            }
          });
        }

        questionsEl.appendChild(btn);
      });
    }

    function enterInterrogateSection() {
      inInterrogateMode = true;
      interrogateState.strangerIndex = 0;
      interrogateState.questionsAsked = SESSION_STRANGERS.map(() => []);
      interrogateState.answersGiven   = SESSION_STRANGERS.map(() => []);

      introSection.classList.remove('visible');
      interrogateSection.classList.add('visible');

      renderInterrogateStranger(0);

      arrowBtn.classList.add('show');
      interrogateTooltip.textContent = 'Next stranger →';
      interrogateTooltip.classList.add('show');

    function advanceInterrogate() {
      if (interrogateState.strangerIndex < SESSION_STRANGERS.length - 1) {
        interrogateState.strangerIndex++;
        renderInterrogateStranger(interrogateState.strangerIndex);
        if (interrogateState.strangerIndex === SESSION_STRANGERS.length - 1) {
          interrogateTooltip.textContent = 'Choose your strangers →';
        }
      } else {
        exitInterrogateSection();
      }
    }

      inInterrogateMode = false;
      interrogateSection.classList.remove('visible');
      interrogateTooltip.classList.remove('show');
      enterPickSection();
    }

      exitInterrogateSection();

      if (inIntroMode) {

    /* ── DOM refs ── */

    const simPondSVG    = document.getElementById('sim-pond-svg');
    const simPondCircle = document.getElementById('sim-pond-circle');

    /* ── Sim state ── */
    let simRunning = false;
    let simFish    = 12;
    let pondDots   = [];   // { el: SVGCircle, alive: bool }
    let simPlayers = [];
    let logLines   = [];

    /* ────────────────────────────────────────
       HELPERS
    ──────────────────────────────────────── */
    function getTakeAmount(player) {
      if (player.id === 'you' || player.type === 'pure') return 1;
      return Math.random() < 0.7 ? 2 : 3;
    }

    function updateSimFishCount() {
      simFishCountEl.textContent = `${simFish} fish remaining`;
    }

    function showPhase(text) {
      simPhaseEl.style.opacity = '0';
      setTimeout(() => {
        simPhaseEl.textContent = text;
        simPhaseEl.style.opacity = '1';
      }, 180);
    }

    function addLog(text) {
      const line = document.createElement('div');
      line.className = 'sim-log-line';
      line.textContent = text;
      line.style.opacity = '0';
      simLogEl.appendChild(line);
      logLines.push(line);
      requestAnimationFrame(() => {
        line.style.opacity = '1';
      });
      // Fade out and remove oldest line if over 5
      while (logLines.length > 5) {
        const old = logLines.shift();
        old.style.opacity = '0';
        setTimeout(() => { if (old.parentNode) old.parentNode.removeChild(old); }, 400);
      }
    }

    /* ────────────────────────────────────────
       POND DOTS
    ──────────────────────────────────────── */
    function initPond() {
      // Remove any existing dots
      pondDots.forEach(d => { if (d.el.parentNode) d.el.parentNode.removeChild(d.el); });
      pondDots = [];
      simFish = 12;

      for (let i = 0; i < 12; i++) {
        const angle = (i * 30 - 90) * Math.PI / 180;
        const cx = (140 + 100 * Math.cos(angle)).toFixed(1);
        const cy = (140 + 100 * Math.sin(angle)).toFixed(1);

        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('cx', cx);
        c.setAttribute('cy', cy);
        c.setAttribute('r', '9');
        c.setAttribute('fill', '#0a0a0a');
        c.style.transition = 'fill 0.35s ease, opacity 0.35s ease';
        c.style.opacity = '1';
        simPondSVG.appendChild(c);
        pondDots.push({ el: c, alive: true });
      }

      updateSimFishCount();
    }

    /* Remove one fish dot — flash red then fade out */
    function removeFishDot() {
      const alive = pondDots.filter(d => d.alive);
      if (!alive.length) return;
      const dot = alive[alive.length - 1];
      dot.alive = false;
      dot.el.setAttribute('fill', '#e74c3c');
      setTimeout(() => { dot.el.style.opacity = '0'; }, 280);
    }

    /* Revive `count` dead dots — animate green → black, call done when finished */
    function replenishDots(count, done) {
      if (count <= 0) { setTimeout(done, 200); return; }
      const dead = pondDots.filter(d => !d.alive).slice(0, count);
      if (!dead.length)  { setTimeout(done, 200); return; }
      dead.forEach((dot, i) => {
        setTimeout(() => {
          dot.alive = true;
          dot.el.style.opacity = '1';
          dot.el.setAttribute('fill', '#27ae60');
          setTimeout(() => dot.el.setAttribute('fill', '#0a0a0a'), 500);
          if (i === dead.length - 1) setTimeout(done, 650);
        }, i * 180);
      });
    }

    /* ────────────────────────────────────────
       PLAYER ROW
    ──────────────────────────────────────── */
    function buildSimPlayerRow(players) {
      simPlayersEl.innerHTML = '';
      players.forEach(p => {
        const card = document.createElement('div');
        card.className = 'sim-player-card';
        card.innerHTML = `
          <span class="spc-name">${p.name}</span>
          ${p.label ? `<span class="spc-label">${p.label}</span>` : ''}
        `;
        simPlayersEl.appendChild(card);
      });
    }

    /* ────────────────────────────────────────
       DAY LOOP
    ──────────────────────────────────────── */
    function runDay(dayNum) {
      if (!simRunning) return;
      simDayEl.textContent = `Day ${dayNum}`;
      showPhase('Morning. Everyone takes their fish.');

      let pi = 0;

      function nextPlayer() {
        if (!simRunning) return;

        // Collapse check before each player
        if (simFish <= 0) { setTimeout(() => endSim('collapse'), 600); return; }

        if (pi >= simPlayers.length) {
          // All players done — pause then run night
          setTimeout(runNight, 1500);
          return;
        }

        const player = simPlayers[pi++];
        const take = Math.min(getTakeAmount(player), simFish);

        for (let f = 0; f < take; f++) removeFishDot();
        simFish -= take;
        updateSimFishCount();
        addLog(`${player.name} takes ${take} fish.`);

        if (simFish <= 0) {
          setTimeout(() => endSim('collapse'), 900);
          return;
        }

        setTimeout(nextPlayer, 800);
      }

      function runNight() {
        if (!simRunning) return;
        showPhase('Night. The pond replenishes.');

        const newFish = Math.min(Math.floor(simFish / 2), 12 - simFish);

        replenishDots(newFish, () => {
          simFish += newFish;
          updateSimFishCount();
          addLog(`The pond grew by ${newFish} fish. ${simFish} fish remain.`);

          if (dayNum >= 30) {
            setTimeout(() => endSim('survive'), 1200);
          } else {
            setTimeout(() => runDay(dayNum + 1), 1200);
          }
        });
      }

      nextPlayer();
    }

    /* ────────────────────────────────────────
       ENDING
    ──────────────────────────────────────── */
    function endSim(outcome) {
      simRunning = false;
      const isCollapse = outcome === 'collapse';

      // Animate pond
      if (isCollapse) {
        simPondCircle.setAttribute('fill', '#c0392b'); // fill red over 1.5s (CSS transition)
      } else {
        simPondCircle.style.transition = 'fill 0.8s ease';
        simPondCircle.setAttribute('fill', 'rgba(245,200,0,0.55)');
      }

      // After 2s, show ending overlay
      setTimeout(() => {
        const bg  = isCollapse ? '#0a0a0a' : '#f5c800';
        const col = isCollapse ? '#f0ece0' : '#0a0a0a';

        simEndEl.style.background = bg;
        simEndEl.classList.add('visible');

        const endLines = document.getElementById('end-lines');
        endLines.innerHTML = '';

        const mainLines = isCollapse
          ? [
              { text: 'The commons is dead.',                    cls: 'end-heading' },
              { text: 'Nobody broke the rule on purpose.',        cls: 'end-body' },
              { text: 'Nobody had to.',                          cls: 'end-body' },
              { text: 'This is the Tragedy of the Commons.',      cls: 'end-body' },
            ]
          : [
              { text: 'The commons survived.',                    cls: 'end-heading' },
              { text: 'You got lucky with who you chose.',        cls: 'end-body' },
              { text: 'But luck is not a governance system.',     cls: 'end-body' },
              { text: 'The design was always the problem.',       cls: 'end-body' },
            ];

        // Reveal main lines one at a time, 3s apart
        mainLines.forEach((line, i) => {
          const el = document.createElement('div');
          el.className = `end-line ${line.cls}`;
          el.textContent = line.text;
          el.style.color = col;
          el.style.opacity = '0';
          endLines.appendChild(el);
          setTimeout(() => { el.style.opacity = '1'; }, 600 + i * 3000);
        });

        // Final italic line — 4s after last main line
        const finalDelay = 600 + (mainLines.length - 1) * 3000 + 4000;
        const finalEl = document.createElement('div');
        finalEl.className = 'end-line end-final';
        finalEl.textContent = 'The world produces enough food to feed all 8.2 billion people on this planet. 673 million went hungry in 2024. The commons was never the problem. The design was.';
        finalEl.style.color = col;
        finalEl.style.opacity = '0';
        endLines.appendChild(finalEl);
        setTimeout(() => { finalEl.style.opacity = '1'; }, finalDelay);

        // Refresh line — 3s after final line
        const refreshEl = document.createElement('div');
        refreshEl.className = 'end-line end-refresh';
        refreshEl.textContent = 'Refresh to try again with different strangers.';
        refreshEl.style.color = col;
        refreshEl.style.opacity = '0';
        endLines.appendChild(refreshEl);
        setTimeout(() => { refreshEl.style.opacity = '0.55'; }, finalDelay + 3000);

      }, 2000);
    }

    /* ────────────────────────────────────────
       ENTER SIMULATION
    ──────────────────────────────────────── */
    function enterSimSection() {
      inPickMode = false;
      simRunning = true;

      console.log('enter simsection is working');

      // Build player list: YOU + 3 selected strangers
      simPlayers = [
        { id: 'you', name: 'YOU', label: '', type: 'pure' },
        ...selectedIds.map(id => ALL_CHARACTERS.find(c => c.id === id))
      ];

      // Build player row
      buildSimPlayerRow(simPlayers);

      // Reset UI
      simLogEl.innerHTML = '';
      logLines = [];
      simPhaseEl.textContent = '';
      simDayEl.textContent = 'Day 1';

      // Reset pond circle (no fill transition yet)
      simPondCircle.style.transition = 'none';
      simPondCircle.setAttribute('fill', 'transparent');
      requestAnimationFrame(() => {
        simPondCircle.style.transition = 'fill 1.5s ease';
      });

      // Reset ending overlay
      simEndEl.classList.remove('visible');
      document.getElementById('end-lines').innerHTML = '';

      // Init fish dots
      initPond();

      // Hide pick section artifacts
      pickSection.classList.remove('visible');
      arrowBtn.classList.remove('show');
      pickWarning.classList.remove('show');

      // Show sim section
      simSection.classList.add('visible');

      // Start day loop after a brief pause for the fade-in
      setTimeout(() => runDay(1), 1400);
    }
  </script>
